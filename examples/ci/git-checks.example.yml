# Corrected OPTIONAL example for a disposable practice repository.
# For this companion repo itself, use companion-validation.workflow.yml instead.
name: Practice Git checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check whitespace across the small practice project
        # Avoid `git diff ... || git diff --check` because the fallback can mask failure.
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Check required files
        run: |
          test -f README.md
          test -f config/app.yaml
