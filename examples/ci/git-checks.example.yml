# Optional example: copy to .github/workflows/git-checks.yml in a disposable
# practice repository containing README.md and config/app.yaml at its root.
name: Practice Git checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check whitespace in tracked files
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Check expected example files
        run: |
          test -f README.md
          test -f config/app.yaml
